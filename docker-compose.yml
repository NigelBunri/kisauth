version: "3.9"
services:
  kisauth:
    build: .
    ports:
      - "4100:4100"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      - db
      - redis
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: kisauth
      POSTGRES_USER: kisauth
      POSTGRES_PASSWORD: kisauth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
volumes:
  pgdata:
